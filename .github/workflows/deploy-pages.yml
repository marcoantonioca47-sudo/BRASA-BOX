name: Deploy BrasaBox to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate BrasaBox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local files referenced by index.html
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          refs=re.findall(r'''(?:src|href)=["']([^"']+)["']''',html,re.I)
          missing=[]
          for ref in refs:
              if ref.startswith(("http://","https://","//","#","data:","mailto:")):
                  continue
              path=ref.split("?",1)[0].split("#",1)[0]
              if path and not Path(path).exists():
                  missing.append(path)
          if missing:
              print("Arquivos locais ausentes:")
              for p in sorted(set(missing)): print(" -",p)
              raise SystemExit(1)
          print("OK: referências locais do index.html encontradas.")
          PY

      - name: Validate JavaScript referenced by index.html
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]+src=[\"']([^\"']+)[\"'][^>]*>",html,re.I)
          local=[]
          for ref in scripts:
              if ref.startswith(("http://","https://","//")): continue
              path=ref.split("?",1)[0].split("#",1)[0]
              if path.endswith(".js"): local.append(path)
          failed=False
          for path in dict.fromkeys(local):
              p=subprocess.run(["node","--check",path],text=True,capture_output=True)
              if p.returncode:
                  failed=True
                  print("\n=== ERRO DE SINTAXE:",path,"===")
                  print(p.stderr or p.stdout)
              else:
                  print("OK",path)
          if failed: raise SystemExit(1)
          PY

      - name: Basic HTML sanity check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("index.html").read_text(encoding="utf-8").lower()
          checks={"doctype":"<!doctype html" in h,"body":("<body" in h and "</body>" in h),"main":"<main" in h,"login":'id="login"' in h}
          print(checks)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Supabase configuration
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("supabase-config.js")
          key=os.environ.get("SUPABASE_ANON_KEY","").strip()
          if not key:
              raise SystemExit("Secret SUPABASE_ANON_KEY não configurado.")
          if "__SUPABASE_ANON_KEY__" not in p.read_text(encoding="utf-8"):
              raise SystemExit("Marcador da chave Supabase não encontrado.")
          p.write_text(p.read_text(encoding="utf-8").replace("__SUPABASE_ANON_KEY__",key),encoding="utf-8")
          print("Configuração Supabase injetada no artefato de deploy.")
      
      - name: Persist public Supabase configuration
        run: |
          if grep -q "__SUPABASE_ANON_KEY__" supabase-config.js; then
            echo "Marcador ainda presente; nada será gravado."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js
          if git diff --cached --quiet; then
            echo "Configuração pública já está atualizada."
          else
            git commit -m "Atualiza configuração pública do Supabase [skip ci]"
            git push
          fi
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
